name: Release

# Bei jedem Tag v* wird das Addon mit dem BigWigs-Packager gepackt und veröffentlicht
# (GitHub Release immer; CurseForge, wenn X-Curse-Project-ID in der TOC und CF_API_KEY gesetzt sind).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
